# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA / Hibernated
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash-lite}

# RapidAPI Configuration
rapidapi.key=${RAPIDAPI_KEY}
rapidapi.twitter.host=twitter-api45.p.rapidapi.com
rapidapi.daily.limit=3300

# 운영 최적화
logging.level.org.hibernate.SQL=ERROR
server.forward-headers-strategy=framework

# 운영은 HTTPS라 로그인 쿠키에 Secure를 붙인다 (http에서는 브라우저가 쿠키를 버리므로 로컬은 false)
atleti.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
