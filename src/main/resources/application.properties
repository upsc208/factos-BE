spring.application.name=atleti-news

# --- Profile Selection ---
# 기본값은 로컬 개발용 h2. 운영은 systemd가 --spring.profiles.active=prod로 직접 지정하므로
# 배포한다고 이 값을 바꿀 필요 없음 ("배포용으로 변경" 커밋 불필요)
spring.profiles.active=prod

# --- Common Configurations ---

# 브라우저에서 이 API를 부를 수 있는 출처. REST(CORS)와 WebSocket 핸드셰이크가 **같은 값**을 쓴다.
#
# 둘을 따로 적어 두면 반드시 갈라진다 — 실제로 REST는 이 목록으로 제한돼 있었는데
# WebSocket만 "*"로 열려 있었다. 아무 사이트나 우리 채팅방에 붙어 읽고 쓸 수 있는 상태였다.
#
# 프론트는 https://atleti.kr, 백엔드는 https://api.atleti.kr — 교차 출처라 이 목록이 실제로 쓰인다.
# 로컬 포트: Next(3000), Vite(5173/5174).
#
# 값 하나가 곧 "이 출처를 신뢰한다"는 뜻이므로 늘릴 때는 이유가 있어야 한다.
# Vercel 프리뷰 배포에서 채팅을 확인해야 하면 .env에 https://*.vercel.app 을 더한다
# (패턴 매칭이라 와일드카드가 동작한다).
atleti.web.allowed-origins=${WEB_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,https://atleti.kr,https://www.atleti.kr}

# Redis (전 프로파일 공통. Docker Compose에서는 REDIS_HOST=redis. docs/redis-design.md 참고)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# 경기 채팅방 상시 오픈 스위치 — true면 킥오프 ±시간 규칙을 무시하고 전부 연다.
# 자유 채팅방("free")은 이 값과 무관하게 항상 열려 있으므로 기본값은 false다.
# 개발 중 경기 방을 강제로 열려면 .env에 CHAT_ALWAYS_OPEN=true를 넣는다.
# (주의: 예전 주석은 "제거하면 닫힌다"였지만 사실이 아니다 — 기본값이 적용될 뿐이다)
atleti.chat.always-open=${CHAT_ALWAYS_OPEN:false}

# 라이브 경기 피드 (docs/live-match-feed-design.md) — 매치데이에 네이버 스포츠를 5초마다
# 폴링해 골 알림을 채팅방에 밀어준다. 비공식 API라 예고 없이 깨질 수 있으므로,
# 문제가 생기면 .env에 LIVE_FEED_ENABLED=false를 넣고 재기동하면 폴링만 멈춘다(채팅은 유지).
#
# Big6: 네이버 월 일정 목록에서 킥오프 시각 + 팀 코드(Club.naverTeamCode)로 경기를 짝짓는다 (LiveMatchMapper).
atleti.live.enabled=${LIVE_FEED_ENABLED:true}

# 라이브 정보를 이만큼 뒤로 민다 (초). 시계·스코어·득점자·골 알림·하프타임에 **모두** 걸린다.
#
# 봇이 중계보다 빠르면 실시간 정보가 아니라 스포일러다. 2026-08-20 라리가 말라가전 실측:
#   · 쿠팡플레이가 실제보다 27~33초 늦다 (8/15 프렌들리는 5초였다 — 라리가는 중계 경로가 길다)
#   · 골 알림은 실제 골로부터 2~20초면 나갔다 → 시청자보다 7~31초 빨랐다
# 30초를 밀면 시계는 시청자보다 3초쯤 뒤, 골 알림은 2~20초 뒤에 뜬다. 앞지르지 않는다.
#
# 2026-08-24 비야레알전 실측: 30초로 돌렸더니 시계가 쿠팡플레이보다 5초 **뒤처졌다** —
# 이 경기의 중계 지연은 25초쯤이었다는 뜻이다. 25초로 낮춰 시계를 중계에 붙인다.
# 앞지르는 쪽으로 넘어가지는 않는다: 25초여도 골 알림은 실제 골로부터 27~45초라 여전히 뒤다.
#
# **대회·중계 경로마다 다른 값**이라 재배포 없이 바꿀 수 있게 설정으로 뺐다.
# 0을 넣으면 지연이 없다 (8/20 이전 동작).
atleti.live.delay-seconds=${LIVE_DELAY_SEC:25}


# 외부 소스 주소. 기본값이 실제 서비스라 운영에서는 신경 쓸 필요 없다.
# 로컬 리허설(scripts/fake-live-match.js)에서만 localhost로 갈아끼운다 —
# 경기가 없는 날에도 폴러·매핑·골 알림·폴백을 실제 코드 경로로 돌려보기 위한 것.
atleti.source.naver-base-url=${NAVER_BASE_URL:https://api-gw.sports.naver.com}
atleti.source.fotmob-base-url=${FOTMOB_BASE_URL:https://www.fotmob.com}

# 크롤러 서버(factos-CRAWLER). 같은 서버의 Docker 컨테이너라 localhost로 부른다 — 외부 포트는 닫혀 있다.
# 로컬 개발에서도 PyCharm으로 띄운 크롤러가 8000번이라 기본값을 그대로 쓴다.
atleti.source.crawler-base-url=${CRAWLER_BASE_URL:http://localhost:8000}

# ipHash용 salt — 운영은 .env의 무작위 값 사용 (같은 IP가 항상 같은 4자리로 보이되 역추적 불가)
atleti.chat.ip-salt=${CHAT_IP_SALT:atleti-dev-salt}

# 관리자 API 키 (X-Admin-Key 헤더) — 비어 있으면 관리자 API 전부 잠김
atleti.admin.key=${ADMIN_KEY:}
atleti.admin.username=${ADMIN_USERNAME:}
atleti.admin.password=${ADMIN_PASSWORD:}
atleti.admin.token-secret=${ADMIN_TOKEN_SECRET:}

# 회원 로그인 (카카오·구글, 댓글·즐겨찾기용). member/auth 패키지
# token-secret이 비어 있으면 로그인이 통째로 꺼진다 (/api/auth/providers가 빈 목록).
# 앱 키가 비어 있는 제공자는 버튼이 안 뜬다. 카카오 client-id는 "REST API 키"
# 카카오·구글 콘솔의 Redirect URI = {callback-base-url}/api/auth/kakao/callback, /api/auth/google/callback
atleti.auth.token-secret=${AUTH_TOKEN_SECRET:}
atleti.auth.session-days=${AUTH_SESSION_DAYS:30}
# 로그인 JWT 서명 키 (EC P-256 JWK → base64). 다른 서비스는 /.well-known/jwks.json의 공개 키로 검증한다.
# 비우면 뜰 때마다 임시 키를 만든다 (재시작 = 전원 로그아웃). 만드는 법: infra/compose/README.md
atleti.auth.jwt-key=${AUTH_JWT_KEY:}
atleti.auth.callback-base-url=${AUTH_CALLBACK_BASE_URL:http://localhost:8080}
atleti.auth.front-base-url=${AUTH_FRONT_BASE_URL:http://localhost:3000}
atleti.auth.cookie-domain=${AUTH_COOKIE_DOMAIN:}
atleti.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
atleti.auth.kakao.client-id=${KAKAO_CLIENT_ID:}
atleti.auth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
# 탈퇴 때 카카오 앱 연결 끊기용 "어드민 키" (없으면 끊기만 건너뛰고 탈퇴는 진행)
atleti.auth.kakao.admin-key=${KAKAO_ADMIN_KEY:}
atleti.auth.google.client-id=${GOOGLE_CLIENT_ID:}
atleti.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:NO_KEY}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
gemini.api.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

# RapidAPI Configuration
rapidapi.key=${RAPIDAPI_KEY:NO_KEY}
rapidapi.twitter.host=twitter-api45.p.rapidapi.com
rapidapi.daily.limit=3300

# 팀 브리핑 5줄 (HeadlineService, Gemini). 끄려면 ENABLED_HEADLINE=false
atleti.news.enabled.headline=${ENABLED_HEADLINE:true}

# factos(Big6) 전환 스위치.
# - club-rss: BBC·Sky RSS → 크롤러(/extract, /translate) 경로. factos의 기본 수집 경로다
# - max-age-hours: 이보다 오래된 RSS 기사는 받지 않는다 (첫 실행 때 100건이 한꺼번에 번역 대기열에 들어가는 것 방지)
atleti.news.enabled.club-rss=${ENABLED_CLUB_RSS:true}
atleti.news.club-rss.max-age-hours=${CLUB_RSS_MAX_AGE_HOURS:24}
# 팀별 기자 트윗 (명단: ClubJournalists). 39명 × 30분 간격 = 하루 1872회로 rapidapi.daily.limit(3300) 안쪽
atleti.news.enabled.club-twitter=${ENABLED_CLUB_TWITTER:true}
atleti.news.club-twitter.interval-minutes=${CLUB_TWITTER_INTERVAL_MIN:30}

# ── 운영 통계 (Prometheus → Grafana, infra/compose/monitoring) ──
# nginx는 /actuator를 밖으로 내지 않는다. Prometheus가 내부망(backend:8080)으로 긁는다
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=backend
# 응답 시간 p95·p99를 Grafana에서 계산하려고 구간(histogram)을 남긴다
management.metrics.distribution.percentiles-histogram.http.server.requests=true
