# H2 Database Configuration for Testing (In-Memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_UPPER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 테스트 전용 Redis DB 인덱스 — 개발 중인 로컬 채팅 데이터(DB 0)와 섞이지 않게 분리한다.
# ChatRoomIntegrationTest가 이 인덱스의 채팅 키를 지우고 시작한다.
spring.data.redis.database=15

# 테스트 중에 실제 BBC·Sky·크롤러를 부르지 않도록 Big6 수집 루프를 끈다
atleti.news.enabled.club-rss=false

# atleti.chat.always-open은 일부러 지정하지 않는다.
# application.properties의 기본값(false)이 적용되어야 경기방 개폐 규칙을 검증할 수 있다.

# 테스트가 FotMob을 부르지 않게: 데이터가 비어도 요청을 계기로 수집하지 않는다
atleti.match.refresh-on-empty=false
# 팀 브리핑 정기 실행 끔 (테스트는 서비스를 직접 부른다)
atleti.news.enabled.headline=false
