# factos 전체 스택 (설계도: Oracle Cloud VM 한 대 · Docker Compose)
#
#   운영:  CI가 GHCR에 올린 이미지를 받는다 — deploy.sh가 docker compose pull/up을 부른다
#   로컬:  docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#          (build 설정은 docker-compose.build.yml에만 있다)
#
# 이미지 태그는 tags.env(deploy.sh가 쓴다)의 BACKEND_TAG / WEB_TAG / CRAWLER_TAG. 없으면 latest
#
# 밖으로 열리는 건 nginx 하나뿐이다 (ports가 있는 서비스가 nginx뿐).
# 나머지는 compose 네트워크 안에서 서비스 이름으로만 서로 부른다: backend:8080, web:3000, crawler:8000, postgres:5432, redis:6379
#

name: factos

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cloudflare-ips.conf:/etc/nginx/cloudflare-ips.conf:ro
      - ./nginx/proxy-headers.conf:/etc/nginx/proxy-headers.conf:ro
    depends_on:
      - web
      - backend
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${REGISTRY:-ghcr.io/upsc208}/factos-web:${WEB_TAG:-latest}
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:8080 # 서버 렌더링은 내부망으로 바로
    mem_limit: 1g
    logging: *logging

  backend:
    image: ${REGISTRY:-ghcr.io/upsc208}/factos-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      CRAWLER_BASE_URL: http://crawler:8000
      # 프론트와 API가 같은 주소라 출처·콜백·프론트 주소가 모두 SITE_URL
      WEB_ALLOWED_ORIGINS: ${SITE_URL}
      AUTH_CALLBACK_BASE_URL: ${SITE_URL}
      AUTH_FRONT_BASE_URL: ${SITE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 2g
    logging: *logging

  crawler:
    image: ${REGISTRY:-ghcr.io/upsc208}/factos-crawler:${CRAWLER_TAG:-latest}
    restart: unless-stopped
    volumes:
      # 번역 모델(4GB)은 이미지에 넣지 않는다
      - ${CRAWLER_MODELS_DIR:-../../../factos-CRAWLER/models}:/app/models:ro
    environment:
      TRANSLATE_THREADS: "4"
    mem_limit: 6g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 120s
    logging: *logging

  postgres:
    # 설계도의 pgvector를 미리 쓸 수 있는 이미지 (확장은 CREATE EXTENSION vector로 켤 때만 쓰인다)
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 채팅 기록·조회수 마커가 재시작에도 남게 AOF를 켠다
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    logging: *logging

volumes:
  pgdata:
  redisdata:
