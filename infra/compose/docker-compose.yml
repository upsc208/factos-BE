# factos 전체 스택 (설계도: Oracle Cloud VM 한 대 · Docker Compose)
#
#   운영:  CI가 GHCR에 올린 이미지를 받는다 — deploy.sh가 docker compose pull/up을 부른다
#   로컬:  docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#          (build 설정은 docker-compose.build.yml에만 있다)
#
# 이미지 태그는 tags.env(deploy.sh가 쓴다)의 BACKEND_TAG / WEB_TAG / CRAWLER_TAG. 없으면 latest
#
# 밖으로 열리는 건 nginx 하나뿐이다 (ports가 있는 서비스가 nginx뿐).
# 나머지는 compose 네트워크 안에서 서비스 이름으로만 서로 부른다: backend:8080, travel:8090, web:3000, crawler:8000, postgres:5432, travel-db:5432, redis:6379
#
# 서비스와 DB (MSA — DB를 같이 쓰지 않는다)
#   backend(football-svc) ─ postgres      travel(travel-svc) ─ travel-db (PostGIS)
#   둘 사이는 REST(travel → backend:8080)와 Redis Stream(events:match)으로만 통신한다
#

name: factos

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cloudflare-ips.conf:/etc/nginx/cloudflare-ips.conf:ro
      - ./nginx/proxy-headers.conf:/etc/nginx/proxy-headers.conf:ro
    depends_on:
      - web
      - backend
      - travel
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${REGISTRY:-ghcr.io/upsc208}/factos-web:${WEB_TAG:-latest}
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:8080 # 서버 렌더링은 내부망으로 바로
    mem_limit: 1g
    logging: *logging

  backend:
    image: ${REGISTRY:-ghcr.io/upsc208}/factos-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      CRAWLER_BASE_URL: http://crawler:8000
      # 프론트와 API가 같은 주소라 출처·콜백·프론트 주소가 모두 SITE_URL
      WEB_ALLOWED_ORIGINS: ${SITE_URL}
      AUTH_CALLBACK_BASE_URL: ${SITE_URL}
      AUTH_FRONT_BASE_URL: ${SITE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 2g
    logging: *logging

  crawler:
    image: ${REGISTRY:-ghcr.io/upsc208}/factos-crawler:${CRAWLER_TAG:-latest}
    restart: unless-stopped
    volumes:
      # 번역 모델(4GB)은 이미지에 넣지 않는다
      - ${CRAWLER_MODELS_DIR:-../../../factos-CRAWLER/models}:/app/models:ro
    environment:
      TRANSLATE_THREADS: "4"
    mem_limit: 6g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 120s
    logging: *logging

  # travel-svc — 축구 여행 (경기장 가이드·펍 지도·직관 기록·킥오프 알림). 자기 DB(travel-db)를 쓴다
  travel:
    image: ${REGISTRY:-ghcr.io/upsc208}/factos-travel:${TRAVEL_TAG:-latest}
    restart: unless-stopped
    environment:
      TRAVEL_DB_HOST: travel-db
      TRAVEL_DB_PORT: "5432"
      TRAVEL_DB_NAME: travel
      TRAVEL_DB_USERNAME: travel
      TRAVEL_DB_PASSWORD: ${TRAVEL_DB_PASSWORD}
      TRAVEL_ADMIN_KEY: ${TRAVEL_ADMIN_KEY:-}
      REDIS_HOST: redis
      FOOTBALL_BASE_URL: http://backend:8080   # football-svc 공개 API·JWKS를 내부망으로
      WEB_ALLOWED_ORIGINS: ${SITE_URL}         # 글·댓글 쓰기 Origin 검사
      SITE_URL: ${SITE_URL}                    # OSM(Overpass)에 보내는 User-Agent 연락처
      TRAVEL_GBP_KRW: ${TRAVEL_GBP_KRW:-}      # 경기장 가격 원화 표시 (1파운드 = 몇 원)
    depends_on:
      travel-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    logging: *logging

  # travel-svc 전용 DB. PostGIS가 들어 있다 (arm64도 되는 다중 아키텍처 이미지)
  travel-db:
    image: imresamu/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: travel
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: ${TRAVEL_DB_PASSWORD}
    volumes:
      - travel-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    logging: *logging

  postgres:
    # 설계도의 pgvector를 미리 쓸 수 있는 이미지 (확장은 CREATE EXTENSION vector로 켤 때만 쓰인다)
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 채팅 기록·조회수 마커가 재시작에도 남게 AOF를 켠다
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    logging: *logging

  # ── 운영 통계 (profile "monitoring": .env에 COMPOSE_PROFILES=monitoring 을 넣어야 뜬다) ──
  # Grafana: 사이트 /grafana/ (sadmin 로그인만, nginx auth_request) + 비상용 서버 안 127.0.0.1:3001 (ssh -L, admin 비밀번호).
  # 나머지는 포트를 열지 않는다
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    mem_limit: 768m
    logging: *logging

  # 컨테이너별 CPU·메모리
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    profiles: [monitoring]
    restart: unless-stopped
    privileged: true
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    mem_limit: 256m
    logging: *logging

  # 서버 자체 CPU·메모리·디스크
  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: [monitoring]
    restart: unless-stopped
    pid: host
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro
    mem_limit: 64m
    logging: *logging

  # Grafana용 읽기 전용 DB 계정을 만든다 (뜰 때마다 한 번 돌고 끝난다)
  grafana-db-init:
    image: postgres:16-alpine
    profiles: [monitoring]
    restart: "no"
    entrypoint: ["sh", "/db-readonly.sh"]
    environment:
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TRAVEL_DB_PASSWORD: ${TRAVEL_DB_PASSWORD}
    volumes:
      - ./monitoring/db-readonly.sh:/db-readonly.sh:ro
    depends_on:
      # 테이블이 다 생긴 뒤에 권한을 준다 (backend는 ddl-auto, travel은 Flyway)
      backend:
        condition: service_healthy
      travel:
        condition: service_healthy
    logging: *logging

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}   # 비어 있으면 grafana-db-init이 실패해 Grafana가 뜨지 않는다
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Seoul
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/system.json
      # 사이트 /grafana/ 아래에서 연다 (nginx가 sadmin만 들여보낸다 — nginx.conf "통계")
      GF_SERVER_ROOT_URL: ${SITE_URL}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # nginx가 확인한 sadmin을 X-WEBAUTH-USER(sadmin-<회원 id>)로 넘긴다 → 보기 전용(Viewer)으로 자동 로그인
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      # 데이터 소스 파일(datasources.yml)이 읽는 값
      POSTGRES_DB: ${POSTGRES_DB}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      grafana-db-init:
        condition: service_completed_successfully
    mem_limit: 384m
    logging: *logging

volumes:
  pgdata:
  redisdata:
  travel-pgdata:
  promdata:
  grafanadata:
