# factos 앞단 nginx — 밖으로 열린 유일한 컨테이너.
#   /api/travel → travel:8090 (travel-svc)
#   /api, /ws  → backend:8080 (football-svc)
#   그 밖      → web:3000 (Next.js)
# Cloudflare가 HTTPS를 끝내고 이 nginx에 http로 넘긴다고 본다.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # 진짜 클라이언트 IP: Cloudflare에서 온 요청일 때만 CF-Connecting-IP를 믿는다.
    # 아무나 이 헤더를 붙여 보내면 그 값은 버려진다 → 백엔드로는 항상 검증된 IP만 넘긴다
    include /etc/nginx/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;

    log_format main '$remote_addr "$request" $status $body_bytes_sent ${request_time}s "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    client_max_body_size 2m;

    # WebSocket 업그레이드
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Cloudflare가 붙인 원래 스킴(https). 로컬처럼 직접 붙으면 nginx가 받은 스킴
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    upstream backend { server backend:8080; keepalive 32; }
    upstream travel  { server travel:8090;  keepalive 16; }
    upstream web     { server web:3000;     keepalive 32; }

    server {
        listen 80 default_server;
        server_name _;

        # 공통 헤더는 location마다 include한다 — location 안에 proxy_set_header가 하나라도 있으면
        # server 단계의 proxy_set_header는 물려받지 않기 때문이다 (nginx 규칙)

        # travel-svc. /api/ 보다 길어서 먼저 잡힌다 (nginx는 가장 긴 접두사를 고른다)
        location /api/travel/ {
            include /etc/nginx/proxy-headers.conf;
            proxy_set_header Connection "";
            proxy_pass http://travel;
            proxy_read_timeout 30s;
        }

        location /api/ {
            include /etc/nginx/proxy-headers.conf;
            proxy_set_header Connection "";
            proxy_pass http://backend;
            proxy_read_timeout 60s;
        }

        # 채팅 (STOMP over WebSocket). 연결이 오래 산다
        location /ws {
            include /etc/nginx/proxy-headers.conf;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://backend;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # 백엔드 API 문서는 밖에 내지 않는다
        location ~ ^/(swagger-ui|v3/api-docs) {
            return 404;
        }

        location / {
            include /etc/nginx/proxy-headers.conf;
            proxy_set_header Connection "";
            proxy_pass http://web;
        }
    }
}
