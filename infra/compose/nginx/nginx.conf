# factos 앞단 nginx — 밖으로 열린 유일한 컨테이너.
#   /api/travel → travel:8090 (travel-svc)
#   /api, /ws  → backend:8080 (football-svc)
#   그 밖      → web:3000 (Next.js)
# Cloudflare가 HTTPS를 끝내고 이 nginx에 http로 넘긴다고 본다.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # 진짜 클라이언트 IP: Cloudflare에서 온 요청일 때만 CF-Connecting-IP를 믿는다.
    # 아무나 이 헤더를 붙여 보내면 그 값은 버려진다 → 백엔드로는 항상 검증된 IP만 넘긴다
    include /etc/nginx/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;

    log_format main '$remote_addr "$request" $status $body_bytes_sent ${request_time}s "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    client_max_body_size 2m;

    # WebSocket 업그레이드
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Cloudflare가 붙인 원래 스킴(https). 로컬처럼 직접 붙으면 nginx가 받은 스킴
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    upstream backend { server backend:8080; keepalive 32; }
    upstream travel  { server travel:8090;  keepalive 16; }
    upstream web     { server web:3000;     keepalive 32; }

    server {
        listen 80 default_server;
        server_name _;

        # 공통 헤더는 location마다 include한다 — location 안에 proxy_set_header가 하나라도 있으면
        # server 단계의 proxy_set_header는 물려받지 않기 때문이다 (nginx 규칙)

        # travel-svc. /api/ 보다 길어서 먼저 잡힌다 (nginx는 가장 긴 접두사를 고른다)
        location /api/travel/ {
            include /etc/nginx/proxy-headers.conf;
            proxy_set_header Connection "";
            proxy_pass http://travel;
            proxy_read_timeout 30s;
        }

        location /api/ {
            include /etc/nginx/proxy-headers.conf;
            proxy_set_header Connection "";
            proxy_pass http://backend;
            proxy_read_timeout 60s;
        }

        # 채팅 (STOMP over WebSocket). 연결이 오래 산다
        location /ws {
            include /etc/nginx/proxy-headers.conf;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://backend;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # 백엔드 API 문서는 밖에 내지 않는다
        location ~ ^/(swagger-ui|v3/api-docs) {
            return 404;
        }

        # ── 통계 (Grafana) — sadmin만 ─────────────────────────
        # 요청마다 백엔드에 "이 쿠키가 sadmin인지" 묻고(auth_request), 맞으면 Grafana에 그 이름으로 넘긴다
        # (Grafana auth proxy). 클라이언트가 보낸 X-WEBAUTH-USER는 아래 proxy_set_header가 덮어쓴다.
        # grafana는 profile(monitoring)이 꺼져 있으면 없다 → 변수로 요청 때 찾는다 (없으면 502, nginx는 뜬다)
        location /grafana/ {
            auth_request /_stats_access;
            auth_request_set $stats_user $upstream_http_x_factos_user;
            error_page 401 = @stats_login;
            error_page 403 = @stats_denied;

            include /etc/nginx/proxy-headers.conf;
            proxy_set_header X-WEBAUTH-USER $stats_user;
            proxy_set_header Upgrade    $http_upgrade;     # Grafana Live (WebSocket)
            proxy_set_header Connection $connection_upgrade;
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $grafana_upstream http://grafana:3000;
            proxy_pass $grafana_upstream;
        }

        location = /_stats_access {
            internal;
            proxy_pass http://backend/api/auth/stats-access;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $host;
        }

        location @stats_login  { absolute_redirect off; return 302 /me; }  # 상대 주소로 (포트·스킴을 그대로)
        location @stats_denied { default_type text/plain; return 403 "sadmin only\n"; }

        location / {
            include /etc/nginx/proxy-headers.conf;
            proxy_set_header Connection "";
            proxy_pass http://web;
        }
    }
}
